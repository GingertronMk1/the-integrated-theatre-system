name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Bootstrap Sail
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app composer:2 install --ignore-platform-reqs --no-interaction --no-scripts --prefer-dist

      - name: Cache Sail image
        id: sail-image-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /tmp/sail-image.tar
          key: ${{ runner.os }}-sail-image-${{ hashFiles('composer.lock', 'compose.yaml', 'vendor/laravel/sail/runtimes/8.5/**') }}

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          printf "\nDB_HOST=mysql\nDB_PORT=3306\nDB_DATABASE=laravel\nDB_USERNAME=sail\nDB_PASSWORD=password\n" >> .env
          echo "WWWUSER=$(id -u)" >> .env
          echo "WWWGROUP=$(id -g)" >> .env

      - name: Restore or build Sail image
        run: |
          if [ "${{ steps.sail-image-cache.outputs.cache-hit }}" = 'true' ]; then
            docker load --input /tmp/sail-image.tar
          else
            vendor/bin/sail build
            docker save sail-8.5/app --output /tmp/sail-image.tar
          fi

      - name: Cache npm downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .npm-cache
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Set up application
        id: setup
        run: |
          vendor/bin/sail up -d
          for attempt in $(seq 1 60); do
            if vendor/bin/sail exec -T mysql mysqladmin ping -h localhost -ppassword --silent; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              exit 1
            fi
            sleep 2
          done
          vendor/bin/sail composer install --no-interaction --prefer-dist
          vendor/bin/sail artisan key:generate --no-interaction
          vendor/bin/sail artisan migrate --force --no-interaction
          vendor/bin/sail npm ci --cache /var/www/html/.npm-cache
          vendor/bin/sail npm run build
          vendor/bin/sail artisan config:clear --no-interaction

      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail composer lint:check

      - name: Run static analysis
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail composer types:check

      - name: Run tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail artisan test --compact

  dependabot-auto-merge:
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL" --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
